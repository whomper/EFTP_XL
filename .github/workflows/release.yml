name: Release

# Builds EFTPXL.PRG and the source disk (EFTPXL.ATR) and publishes
# them as a GitHub Release, marked Latest (the one the repository's
# page shows). Two ways to start it:
# - Actions > Release > Run workflow, on main, with the notes: it tags
#   main's commit vX.Y, from VERSION in ASM/EFTPXL.ASM;
# - push a tag vX.Y that matches it: the tag's message (git tag -a) is
#   the notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: "What is new (Markdown): the release's notes"
        required: true
        type: string

permissions:
  contents: write

env:
  # ATasm (Mac/65's source on another computer), at the commit the
  # releases are built and checked with
  ATASM_REV: 46be895a4312205dbcc4cf7a4a6721d72219d711

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Which release
        run: |
          V=$(sed -n 's/^VERSION *\.BYTE "EFTP_XL \([^"]*\)".*/\1/p' ASM/EFTPXL.ASM)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG=$GITHUB_REF_NAME
            if [ "$TAG" != "v$V" ]; then
              echo "::error::tag $TAG, but ASM/EFTPXL.ASM says $V"
              exit 1
            fi
          else
            TAG=v$V
            if [ "$GITHUB_REF_NAME" != main ]; then
              echo "::error::run it on main"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "::error::$TAG is out already: raise VERSION in ASM/EFTPXL.ASM first"
              exit 1
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: ATasm
        run: |
          git init -q "$RUNNER_TEMP/atasm"
          git -C "$RUNNER_TEMP/atasm" fetch -q --depth 1 https://github.com/CycoPH/atasm "$ATASM_REV"
          git -C "$RUNNER_TEMP/atasm" checkout -q FETCH_HEAD
          make -C "$RUNNER_TEMP/atasm/src" -j"$(nproc)" >/dev/null
          echo "$RUNNER_TEMP/atasm/src" >> "$GITHUB_PATH"
      - name: Build
        run: make dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch -q --force origin "refs/tags/$TAG:refs/tags/$TAG"
            git tag -l --format='%(contents)' "$TAG" > "$RUNNER_TEMP/notes.md"
          else
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "EFTP_XL $VERSION" --latest \
            --notes-file "$RUNNER_TEMP/notes.md"
