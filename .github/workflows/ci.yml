name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Atari 8-bit build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: pip install -q -r xl/requirements.txt -r requirements.txt
      - name: Build, the disk (the same program from it), and test
        run: make test
      - name: The build changed no tracked file (and CI publishes nothing)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
